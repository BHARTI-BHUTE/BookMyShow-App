
apiVersion: apps/v1
kind: Deployment

metadata:
  name: bookmyshow
  namespace: bookmyshow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bookmyshow

  template:
    metadata:
      labels:
        app: bookmyshow

    spec:
      containers:
        - name: bookmyshow
          image: nginx:latest
          ports:
            - containerPort: 80
